name: Release build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Permiso de ejecucion para gradlew
        run: chmod +x gradlew

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble release (unsigned, R8)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Report APK size
        run: |
          ls -lh app/build/outputs/apk/release/
          ls -lh app/build/outputs/mapping/release/ || true

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: chat-lobi-ai-release-unsigned
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Publish APK as GitHub Release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ github.run_number }}
          name: Chat-Lobi-Ai build ${{ github.run_number }} (sin firmar)
          body: "APK release sin firmar generado con R8. Para instalarlo hay que firmarlo primero."
          prerelease: true
          files: app/build/outputs/apk/release/*.apk
